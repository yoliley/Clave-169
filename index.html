 return '<section class="panel achievement parrot-party" role="status"><img src="'+parrotImage+'" alt="Loro gris africano bailando" width="92" height="92"><div>'+

let trapFound=false,trapFeedback='';
function trapTokens(q){
 const at=q.trap.indexOf(q.trapWord);
 return [...q.trap.slice(0,at).trim().split(/\s+/).filter(Boolean),q.trapWord,...q.trap.slice(at+q.trapWord.length).trim().split(/\s+/).filter(Boolean)];
}
function findTrap(index){
 const q=test[cursor];
 trapFound=trapTokens(q)[index]===q.trapWord;
 trapFeedback=trapFound?'¡Encontraste la trampa! Ahora elige la corrección.':'Esa parte está bien. Prueba con otra.';
 question();
}
function hintFor(q){
 if(q.hint)return q.hint;
 if(q.steps){
  return q.steps.every(step=>/\d{4}/.test(step))
   ?'Ordena primero por año y después por mes y día.'
   :'Compara dos elementos de la lista cada vez y ordénalos por número de artículo.';
 }
 if(mode==='written')return 'Lee la frase completa y fíjate en qué función cumple el hueco dentro de la regla.';
 if(q.id.endsWith('-art'))return 'Ubica primero la regla en el título o capítulo que estudiaste.';
 if(q.ref)return 'Identifica a quién se aplica la regla y compara las condiciones de cada opción.';
 return 'Identifica qué tipo de dato te piden y compara las palabras que cambian entre las opciones.';
}
function begin(items){
 section=['game','written','trap','battle'].includes(mode)?mode:mode==='daily'?'game':mode==='review'?'review':'test';
 test=items.map(q=>({...q,options:shuffle(q.steps??[q.right,...(q.wrong??[])])}));
 answers=Array(test.length).fill(null);cursor=0;checked=false;sequence=[];trapFound=false;trapFeedback='';
 question();
}
function answerStatus(answer,right){return answer===null?'':answer===right?'correct':'incorrect';}
function question(){
 const q=test[cursor], selected=answers[cursor];
 const instant=['easy','game','review','written','daily','trap','battle'].includes(mode);
 const game=['game','final','written'].includes(mode);
 const order=q.steps;
 const revealOptions=mode!=='trap'||trapFound;
 const trapSentence=q.trap?(mode==='trap'?'<div class="panel trap-tokens">'+
 trapTokens(q).map((word,i)=>'<button type="button" onclick="findTrap('+i+')" '+(trapFound?'disabled':'')+'>'+escapeHtml(word)+'</button>').join('')+
 '<p role="status">'+escapeHtml(trapFeedback||'Toca la parte que está mal.')+'</p></div>':paragraph(q.trap)):'';
 const options=q.options.map((option,i)=>{
  const position=order?sequence.indexOf(option):-1;
  return '<button class="'+(checked&&option===selected?answerStatus(selected,q.right):'')+'" aria-pressed="'+(option===selected||position>=0)+'" '+(checked||position>=0?'disabled':'')+' onclick="selectAnswer('+i+')">'+(position>=0?(position+1)+'. ':'')+escapeHtml(option)+'</button>';
 }).join('');
 render('<span data-active-attempt hidden></span>'+button('Salir del intento',"if(confirm('¿Salir de este intento?'))home()")+
 (game?guide(mode==='written'?'Elige la palabra o el número que falta.':order?'Toca las opciones en el orden correcto.':mode==='final'?'El reto final mezcla los siete bloques.':'Resuelve el reto y comprueba tu respuesta.'):'')+
 '<small>'+escapeHtml(formatBlock(q.block??selectedBlock))+' · '+(cursor+1)+' de '+test.length+'</small>'+
 '<progress value="'+(cursor+1)+'" max="'+test.length+'" aria-label="Progreso"></progress><h2>'+escapeHtml(q.prompt)+'</h2>'+
 (order?paragraph(sequence.length?sequence.join(' → '):'Elige el primer elemento.'):'')+trapSentence+(revealOptions?options:'')+
 (q.retry?'<small>🔁 Segunda oportunidad</small>':'')+
 (checked?'<div class="panel feedback '+answerStatus(selected,q.right)+'" role="status"><strong>'+escapeHtml(selected===q.right?'¡Correcto!':'Respuesta correcta · '+q.right)+'</strong>'+paragraph(q.note)+'</div>':'')+
 (!checked&&(sequence.length||(!instant&&selected!==null))?button(order?'Reiniciar orden':'Quitar respuesta','clearAnswer()'):'')+
 (instant&&!checked&&selected!==null?button('Comprobar','check()',true):'')+
 (instant&&!checked?button('Dejar en blanco','skip()'):'')+
 (!instant&&cursor>0?button('Anterior','move(-1)'):'')+
 (!instant||checked?button(cursor===test.length-1?'Entregar':'Siguiente','move(1)',true):'')+
 (!checked&&practiceModes.includes(mode)?'<details class="hint-area"><summary>Pista de la Llave</summary>'+paragraph(hintFor(q))+'</details>':''));

function selectAnswer(i){
 const q=test[cursor];
 if(q.steps){
  sequence.push(q.options[i]);
  if(sequence.length===q.steps.length)answers[cursor]=sequence.join(' → ');
 }else answers[cursor]=q.options[i];

function clearAnswer(){answers[cursor]=null;sequence=[];question();}
function check(){
 const q=test[cursor];
 if(['game','written','daily','battle'].includes(mode)&&answers[cursor]!==null&&answers[cursor]!==q.right&&!q.retry&&!q.steps){
  const original=questionsFor(q.block).find(item=>item.id===q.id);
  const prompt=original?.prompts.find(text=>text!==q.prompt)??'Vuelve a pensar en esta regla. '+q.prompt;
  const at=Math.min(cursor+3,test.length);
  test.splice(at,0,{...q,prompt,retry:true,options:shuffle(q.options)});

function skip(){answers[cursor]=null;sequence=[];check();}

function finish(){

const emptyProgress=()=>({history:[],mastered:{},memory:{},played:{}});
const snapshotProgress=()=>({history,mastered,memory,played});
function replaceProgress(data){
 history=data.history;
 mastered=data.mastered;
 for(const name of Object.keys(memory))delete memory[name];
 for(const name of Object.keys(played))delete played[name];
 Object.assign(memory,data.memory);
 Object.assign(played,data.played);
}
function mergeProgress(a,b){
 const attempts=new Map([...a.history,...b.history].map(item=>[item.id??JSON.stringify(item),item]));
 const merged={history:[...attempts.values()].sort((x,y)=>y.date.localeCompare(x.date)),mastered:{...a.mastered},memory:{...a.memory},played:{...a.played,...b.played}};
 for(const [id,date] of Object.entries(b.mastered))if(!merged.mastered[id]||date>merged.mastered[id])merged.mastered[id]=date;
 for(const [id,card] of Object.entries(b.memory))if(!merged.memory[id]||(card.updated??0)>=(merged.memory[id].updated??0))merged.memory[id]=card;
 return merged;
}

function queueSync(){
 const uid=account?.uid;
 if(!uid||loadingAccount)return;
 cacheAccount(uid,snapshotProgress());
 syncStatus.textContent='Guardando progreso…';
 syncChain=syncChain.then(async()=>{
  if(account?.uid!==uid)return;
  const pending=accountCache(uid);
  const ref=backend.doc(backend.db,'users',uid);
  await backend.runTransaction(backend.db,async transaction=>{
   const saved=await transaction.get(ref);
   const progress=mergeProgress({...emptyProgress(),...saved.data()},pending);
   transaction.set(ref,progress);
  });
  if(account?.uid===uid)syncStatus.textContent='Progreso sincronizado';
 }).catch(error=>{
  if(account?.uid!==uid)return;
  syncStatus.textContent=error.code==='permission-denied'?'Firestore ha denegado el acceso al progreso. Revisa las reglas de Firebase.':'Pendiente de sincronizar. Puedes reintentar desde Mi cuenta.';
 });
}
